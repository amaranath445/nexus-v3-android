<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS V3.1</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #050914 0%, #0f1a2e 100%);
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 100%;
            width: 100%;
            background: rgba(15, 26, 46, 0.8);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: #4ade80;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #888;
            margin-bottom: 30px;
            font-size: 0.9em;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            color: #4ade80;
            margin-bottom: 10px;
            font-size: 1.1em;
        }

        button {
            background: linear-gradient(135deg, #4ade80 0%, #22c55e 100%);
            color: #000;
            border: none;
            padding: 12px 20px;
            margin: 5px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:active {
            transform: scale(0.95);
            box-shadow: 0 4px 16px rgba(74, 222, 128, 0.3);
        }

        .status {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 6px;
            margin-top: 10px;
            border-left: 3px solid #4ade80;
        }

        .status-item {
            margin: 5px 0;
            font-size: 0.95em;
        }

        .status-value {
            color: #4ade80;
            font-weight: 600;
        }

        .footer {
            text-align: center;
            margin-top: 30px;
            color: #666;
            font-size: 0.85em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌟 NEXUS V3.1</h1>
        <p class="subtitle">Local-first Assistant</p>

        <div class="section">
            <div class="section-title">📱 System Features</div>
            <button onclick="testVibration()">Test Vibration</button>
            <button onclick="testNotification()">Test Notification</button>
            <button onclick="checkStatus()">Check Status</button>
        </div>

        <div class="section">
            <div class="section-title">📊 Device Status</div>
            <div class="status" id="status">
                <div class="status-item">Loading...</div>
            </div>
        </div>

        <div class="section">
            <div class="section-title">⚙️ Information</div>
            <div class="status" id="info">
                <div class="status-item">Device Info: <span class="status-value" id="device-info">-</span></div>
                <div class="status-item">Online: <span class="status-value" id="online-status">-</span></div>
            </div>
        </div>

        <div class="footer">
            <p>NEXUS V3.1 • Android WebView Shell</p>
        </div>
    </div>

    <script>
        function testVibration() {
            if (typeof Android !== 'undefined') {
                Android.vibrate(200);
                updateLog('Vibration sent');
            }
        }

        function testNotification() {
            if (typeof Android !== 'undefined') {
                Android.postNotification('NEXUS', 'Hello from local-first assistant!');
                updateLog('Notification sent');
            }
        }

        function checkStatus() {
            if (typeof Android !== 'undefined') {
                const online = Android.getOnlineStatus();
                const device = Android.getDeviceInfo();
                document.getElementById('online-status').textContent = online ? '✓ Online' : '✗ Offline';
                document.getElementById('device-info').textContent = device;
                updateLog('Status updated');
            }
        }

        function updateLog(message) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerHTML = '<div class="status-item">✓ ' + message + '</div>' + statusDiv.innerHTML;
            if (statusDiv.children.length > 5) {
                statusDiv.removeChild(statusDiv.lastChild);
            }
        }

        // Initialize on load
        window.addEventListener('load', () => {
            checkStatus();
        });
    </script>
</body>
</html>
